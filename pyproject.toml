[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raspibox-drive"
version = "0.1.0"
description = "Cloud storage sync daemon for Raspberry Pi (Google Drive & Dropbox)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["raspberry-pi", "google-drive", "dropbox", "sync", "daemon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.1.0",
    "dropbox>=11.36.0",
    "watchdog>=3.0.0",
    "inotify-simple>=1.3.5",
    "click>=8.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pycryptodome>=3.19.0",
]

[project.optional-dependencies]
tray = ["pystray>=0.19.5", "Pillow>=10.0.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
raspibox-drive = "raspiboxdrive.cli:main"

[project.urls]
Homepage = "https://github.com/waiming/RaspiBoxDrive"
Issues = "https://github.com/waiming/RaspiBoxDrive/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["raspiboxdrive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["raspiboxdrive"]
omit = ["tests/*"]
